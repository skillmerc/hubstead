name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@repo/zod-types --filter=@repo/trpc
      - name: Typecheck
        run: pnpm check-types
      - name: Lint
        run: pnpm lint
      - name: Test (backend)
        run: pnpm --filter backend test

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hubstead:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
