name: Publish image

# Builds the Hubstead image and pushes it to ghcr.io/skillmerc/hubstead.
# Runs only when a tag starting with "v" is pushed, never on pull requests
# or branch pushes. The tag must be vX.Y.Z; any other v tag stops before
# anything is pushed. Pushes two tags: X.Y.Z and latest.
#
# Platform: linux/amd64 only. Upstream's amd64 plus arm64 build under QEMU
# took 27 minutes for v2.4.22 (job "build-and-push", 11 Dec 2025), over our
# 20 minute limit. On Apple silicon, Docker runs the amd64 image under
# emulation.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ghcr.io/skillmerc/hubstead
    if: github.repository == 'skillmerc/hubstead' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $tag is not vX.Y.Z, so nothing is published." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/skillmerc/hubstead:${{ steps.version.outputs.version }}
            ghcr.io/skillmerc/hubstead:latest
          labels: |
            org.opencontainers.image.source=https://github.com/skillmerc/hubstead
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Hubstead
            org.opencontainers.image.description=Hubstead, a maintained fork of MetaMCP: one MCP endpoint for many MCP servers. Needs Postgres.
            org.opencontainers.image.vendor=SKILLMERC (Pty) Ltd
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.modelcontextprotocol.server.name=io.github.skillmerc/hubstead
